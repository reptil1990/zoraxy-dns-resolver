<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.55" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#gloss)"/>

  <!-- upstream: cloud -->
  <g fill="#ffffff">
    <circle cx="106" cy="72" r="18"/>
    <circle cx="128" cy="62" r="23"/>
    <circle cx="152" cy="74" r="16"/>
    <rect x="92" y="72" width="72" height="19" rx="9.5"/>
  </g>

  <!-- routing connectors through the resolver -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="128" y1="92" x2="128" y2="122"/>
    <line x1="128" y1="154" x2="128" y2="170"/>
  </g>

  <!-- horizon: the split between upstream and local -->
  <line x1="44" y1="138" x2="212" y2="138" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.92"/>

  <!-- local: house / LAN -->
  <g fill="#ffffff">
    <path d="M128 160 L160 184 L96 184 Z"/>
    <rect x="107" y="181" width="42" height="33" rx="4"/>
  </g>
  <rect x="121" y="196" width="14" height="18" rx="2" fill="#0E7490"/>

  <!-- resolver node on the horizon -->
  <circle cx="128" cy="138" r="16" fill="#6EE7C7" stroke="#ffffff" stroke-width="5"/>
</svg>
